services:
  - type: web
    name: bwetfarms
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        value: https://bwet-laravel.onrender.com
      - key: APP_FORCE_HTTPS
        value: true
      - key: PORT
        value: 8080
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /var/www/database/database.sqlite
