version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bwetfarms-app
    restart: unless-stopped
    working_dir: /var/www
    env_file:
      - .env.docker
    ports:
      - "8080:8080"
    volumes:
      - .:/var/www
      - ./storage:/var/www/storage
      - ./bootstrap/cache:/var/www/bootstrap/cache
      - sqlite-data:/var/www/database
    command: ["/bin/sh", "/var/www/docker/start.sh"]

volumes:
  sqlite-data:
